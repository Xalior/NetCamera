<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Camera</title>
<style>
/* The client does the scaling, and nothing is asked of the server: the
   picture arrives at the camera's own resolution and the browser fits it to
   whatever window it has been given, exactly as resizing the app's own window
   re-scales rather than re-encodes. */
html, body {
  height: 100%;
  margin: 0;
  background: #000;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}
</style>
</head>
<body>
<img src="/stream" alt="Net Camera live picture">
</body>
</html>
